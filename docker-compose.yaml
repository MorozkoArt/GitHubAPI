services:
  train:
    container_name: devmirror-train
    build:
      context: .
      dockerfile: src/ml/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    profiles:
      - train
    restart: "no"

  app:
    container_name: devmirror-app
    build:
      context: .
      dockerfile: src/app/Dockerfile
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./output:/app/output
      - storage_tmp:/app/storage
    profiles:
      - app
    restart: "no"

volumes:
  storage_tmp: